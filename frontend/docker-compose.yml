services:
  db:
    image: postgres:16-alpine
    container_name: maze-game-db
    environment:
      POSTGRES_USER: maze
      POSTGRES_PASSWORD: maze_secret
      POSTGRES_DB: maze_game
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maze -d maze_game"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
